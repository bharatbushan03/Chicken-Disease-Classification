services:
  - type: web
    name: chicken-disease-classifier
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: model.keras
      - key: ENABLE_TRAINING
        value: "false"
